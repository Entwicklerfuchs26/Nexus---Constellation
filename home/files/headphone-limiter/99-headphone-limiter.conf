# Fester Lautstärke-Deckel für den JBL Live 770NC (Bluetooth-Kopfhörer):
# v1: 90dB bei 100% (iPhone-Messung) -> Ziel 84dB -> Faktor 0.501 (-6dB).
# v2 (2026-08-17, empirisch nachjustiert): bei 45% des v1-limitierten Sinks
# wurde mit externem dB-Meter (misst Leckage außen am Kopfhörer, ~20dB unter
# iPhone-Schätzung) fast exakt der 84dB-Zielwert gemessen (63,8dB vs. 62,8dB
# Referenz). Neue 100%-Marke = alte 45%-Marke -> zusätzlicher Faktor 0.45.
# Gesamtfaktor: 0.501 * 0.45 = 0.2255.
# Virtueller Sink "Kopfhörer (limitiert)" davorschalten, dort 100% = 84dB.
# Fest verdrahteter Mixer-Gain, NICHT über wpctl/Tasten umgehbar.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Kopfhörer (limitiert)"
            media.name       = "Kopfhörer-Limiter"
            filter.graph = {
                nodes = [
                    { type = builtin, name = limit_L, label = mixer, control = { "Gain 1" = 0.10928 } }
                    { type = builtin, name = limit_R, label = mixer, control = { "Gain 1" = 0.10928 } }
                ]
                inputs  = [ "limit_L:In 1" "limit_R:In 1" ]
                outputs = [ "limit_L:Out" "limit_R:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "headphone_limiter_input"
                node.description = "Kopfhörer (limitiert)"
                media.class      = "Audio/Sink"
                audio.channels   = 2
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.name      = "headphone_limiter_output"
                node.target    = "bluez_output.88_92_CC_9B_8A_60.1"
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
